name: Generate sound assets
on:
  push:
    branches: [main]
    paths:
      - "tools/generate_sfx_pack.py"
      - ".github/workflows/generate-sounds.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audio synthesis dependencies
        run: python -m pip install numpy scipy soundfile
      - name: Generate WAV sound pack
        run: python tools/generate_sfx_pack.py
      - name: Commit generated sounds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sound_pack/
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate 30 Pygame shooter WAV effects"
            git push
          fi
